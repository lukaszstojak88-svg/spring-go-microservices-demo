# Local development stack.
#
#   docker compose up --build                  # start (only the BFF port is published)
#   docker compose --profile debug up --build  # also publish Product/Order ports on 127.0.0.1
#   docker compose down                        # stop, keep MongoDB data
#   docker compose down -v                     # stop and remove the MongoDB volume
#
# Configuration: copy .env.example to .env. Every variable below has the same
# development default, so the stack also starts without a .env file.

name: spring-go-microservices-demo

services:
  mongo:
    image: mongo:8.0.34
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root-dev-password}
      # Read only by infra/mongo/init-databases.js on first start.
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME:-products_db}
      PRODUCT_DB_USER: ${PRODUCT_DB_USER:-product_user}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-product-dev-password}
      ORDER_DB_NAME: ${ORDER_DB_NAME:-orders_db}
      ORDER_DB_USER: ${ORDER_DB_USER:-order_user}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order-dev-password}
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init-databases.js:/docker-entrypoint-initdb.d/init-databases.js:ro
    networks:
      - backend
    # No published ports: MongoDB is reachable only inside the backend network.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  product-service:
    build: ./product-service
    image: spring-go-demo/product-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      MONGODB_URI: mongodb://${PRODUCT_DB_USER:-product_user}:${PRODUCT_DB_PASSWORD:-product-dev-password}@mongo:27017/${PRODUCT_DB_NAME:-products_db}?authSource=${PRODUCT_DB_NAME:-products_db}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  order-service:
    build: ./order-service
    image: spring-go-demo/order-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      MONGODB_URI: mongodb://${ORDER_DB_USER:-order_user}:${ORDER_DB_PASSWORD:-order-dev-password}@mongo:27017/${ORDER_DB_NAME:-orders_db}?authSource=${ORDER_DB_NAME:-orders_db}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:8081}
      PRODUCT_CLIENT_CONNECT_TIMEOUT: ${ORDER_PRODUCT_CLIENT_CONNECT_TIMEOUT:-2s}
      PRODUCT_CLIENT_READ_TIMEOUT: ${ORDER_PRODUCT_CLIENT_READ_TIMEOUT:-3s}
    depends_on:
      mongo:
        condition: service_healthy
      # Start order only; at runtime Order Service readiness does not depend on Product Service.
      product-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  bff-service:
    build: ./bff-service
    image: spring-go-demo/bff-service:local
    restart: unless-stopped
    environment:
      PORT: 8080
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:8081}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service:8082}
      PRODUCT_SERVICE_TIMEOUT: ${BFF_PRODUCT_TIMEOUT:-3s}
      ORDER_SERVICE_TIMEOUT: ${BFF_ORDER_TIMEOUT:-5s}
    ports:
      - "${BFF_PORT:-8080}:8080"
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      # Runtime image is distroless (no shell/curl): the binary checks itself.
      test: ["CMD", "/app/bff", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # --- Debug profile: publish Java service ports on localhost only. ---
  # Compose cannot publish a service's ports conditionally, so tiny TCP
  # forwarders are started only with `--profile debug`.
  product-debug-port:
    image: alpine/socat:1.8.1.3
    profiles: ["debug"]
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:product-service:8081"]
    ports:
      - "127.0.0.1:${PRODUCT_DEBUG_PORT:-8081}:8081"
    depends_on:
      product-service:
        condition: service_healthy
    networks:
      - backend

  order-debug-port:
    image: alpine/socat:1.8.1.3
    profiles: ["debug"]
    command: ["TCP-LISTEN:8082,fork,reuseaddr", "TCP:order-service:8082"]
    ports:
      - "127.0.0.1:${ORDER_DEBUG_PORT:-8082}:8082"
    depends_on:
      order-service:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    name: spring-go-demo-backend
    driver: bridge

volumes:
  mongo-data:
    name: spring-go-demo-mongo-data
